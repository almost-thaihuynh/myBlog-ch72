<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="form.css">
    <title>Document</title>
</head>
<body>
    <h1>Forms</h1>
    <div class="form-container">
        <h2 style="text-align: center;">Contact form example</h2>
        <p style="text-align: center;">This is information for the user</p>

        <form>
            
            <div class="input-container">
            <label>Name:</label>
            <input 
            type="text" 
            placeholder="Enter the name" 
            id="txtName" 
            Name="user_name">
            </div>
            
            <div class="input-container">
                <label>Age:</label>
                <input 
                type="number"
                placeholder="Enter the age"
                id="txtAge"
                name="user_age">
            </div>

            <div class="input-container">
                <label>Password:</label>
                <input 
                type="password"
                placeholder="Enter the password"
                id="txtPassword"
                name="user_pass">
            </div>

            <div class="input-container">
                <label>Message:</label>
                <textarea></textarea>
            </div>

            <div class="input-container">
                <label>Phone:</label>
                <input 
                type="tel"
                placeholder="Enter phone number"
                id="txtPhone"
                name="user_phone">
            </div>
            <div class="input-container">
                <label>Date:</label>
                <input 
                type="date"
                placeholder="Enter date">
            </div>

            <button class="send-button">Send</button>

        </form>

    </div>
</body>
</html>
